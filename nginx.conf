server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Deep links — App Links / Universal Links.
    # Served inline so the SPA fallback can never rewrite them to index.html.
    #
    # PLACEHOLDER: no native shell exists for PravAI yet (see CLAUDE.md). Once
    # one does, replace the appID/package_name/fingerprints below with its
    # real values -- shipping the wrong identifiers here silently breaks deep
    # linking rather than erroring, so this is easy to forget.

    # iOS. Apple fetches /.well-known first; the root path stays for older clients.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        return 200 '{"applinks":{"apps":[],"details":[{"appID":"TEAMID.com.example.pravai","paths":["*"]}]}}';
    }

    location = /apple-app-site-association {
        default_type application/json;
        return 200 '{"applinks":{"apps":[],"details":[{"appID":"TEAMID.com.example.pravai","paths":["*"]}]}}';
    }

    # Android. Fingerprints: [0] debug keystore, [1] release keystore.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.example.pravai","sha256_cert_fingerprints":["00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00"]}}]';
    }

    # Vite fingerprints every asset (index-BrcFhsFw.css), so a given URL's bytes
    # never change — cache it for a year and let a new build ship new names.
    # One directive rather than `expires` plus `add_header`, which emit two
    # separate Cache-Control headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # =404 rather than the SPA fallback: a missing asset must not come back
        # as index.html with a .js content type.
        try_files $uri =404;
    }

    # index.html is the one file whose URL stays put while its contents change,
    # and it names the hashed assets. With no cache directives at all a webview
    # falls back to heuristic caching and may hold a stale copy indefinitely —
    # which pins the whole app to an old build no matter what CI deploys. It
    # must be revalidated on every load.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
